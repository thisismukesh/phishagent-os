model:
  name: "mistral:7b"
  ollama_url: "http://localhost:11434"
  temperature: 0.7
  max_tokens: 512
  timeout_seconds: 120
  num_gpu: null  # null = auto-detect (all layers on GPU when CUDA available), 0 = force CPU

conversation:
  max_turns: 10
  turn_delay_seconds: 0.0
  early_termination: true

scoring:
  judge_model: "llama3.2"
  persuasion_weight: 0.4
  coherence_weight: 0.3
  detectability_weight: 0.3
  judge_temperature: 0.1

output:
  base_dir: "output"
  save_conversations: true
  save_csv: true
  conversation_format: "json"

logging:
  level: "INFO"
  file: null
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
