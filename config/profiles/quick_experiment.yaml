experiment_id: "quick_demo_001"
description: "Quick demo: agreeableness x security_awareness x 2 strategies"
model_name: "mistral:7b"
repetitions: 1

base_profile:
  name: "Victim"
  personality:
    openness: 0.5
    conscientiousness: 0.5
    extraversion: 0.5
    agreeableness: 0.5
    neuroticism: 0.5
  communication_style: "casual"
  security_awareness: "medium"
  interests: ["technology", "sports"]
  occupation: "software engineer"
  tech_proficiency: 0.5
  impulsivity: 0.5

vary:
  "personality.agreeableness": [0.2, 0.5, 0.8]
  "security_awareness": ["low", "high"]

attacker_configs:
  - goal: "click_link"
    strategy: "urgency"
    scenario: "it_support"
    max_turns: 3
    escalation_threshold: 2
  - goal: "click_link"
    strategy: "rapport"
    scenario: "colleague"
    max_turns: 3
    escalation_threshold: 2
