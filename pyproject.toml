[project]
name = "phishagent-os"
version = "0.1.0"
description = "Open-Source Social Engineering Simulation Pipeline for defensive research"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
phishagent = "phishagent.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: requires Ollama running locally",
    "e2e: end-to-end tests requiring full system",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
